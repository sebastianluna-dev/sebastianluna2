<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="wood" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f6a35a"/>
      <stop offset="0.35" stop-color="#d0621f"/>
      <stop offset="0.75" stop-color="#9a3410"/>
      <stop offset="1" stop-color="#5e1d07"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a2208"/>
      <stop offset="0.5" stop-color="#b8521c"/>
      <stop offset="1" stop-color="#4a1605"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="0.4" stop-color="#15151b"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a463"/>
      <stop offset="1" stop-color="#8c3110"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g transform="translate(120 122) rotate(34) scale(0.96) translate(0 -14)">
    <!-- ribs (side thickness) -->
    <path d="M4 3C26 3 44 11 44 29c0 14-10 18-13 26-2 6-2 12 0 18 5 8 21 14 21 32 0 20-22 30-48 30S-44 125-44 105c0-18 16-24 21-32 2-6 2-12 0-18-3-8-13-12-13-26C-36 11-18 3 4 3z" fill="url(#edge)"/>
    <!-- top plate -->
    <path id="plate" d="M0 0c22 0 40 8 40 26 0 14-10 18-13 26-2 6-2 12 0 18 5 8 21 14 21 32 0 20-22 30-48 30s-48-10-48-30c0-18 16-24 21-32 2-6 2-12 0-18-3-8-13-12-13-26C-40 8-22 0 0 0z" fill="url(#wood)"/>
    <path d="M0 4c19 0 35 7 35 22 0 12-9 17-12 25-2 7-2 14 0 21 5 8 20 13 20 30 0 17-19 26-43 26s-43-9-43-26c0-17 15-22 20-30 2-7 2-14 0-21-3-8-12-13-12-25C-35 11-19 4 0 4z" fill="none" stroke="#3a1004" stroke-width="1.2" opacity="0.45"/>
    <!-- f-holes -->
    <path d="M-17 52c-4 6 4 10 0 18s-4 14 0 18" fill="none" stroke="#2a0b03" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M17 52c4 6-4 10 0 18s4 14 0 18" fill="none" stroke="#2a0b03" stroke-width="2.6" stroke-linecap="round"/>
    <!-- gloss on the plate -->
    <path d="M-30 18c6-8 16-12 26-13" fill="none" stroke="url(#gloss)" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>
    <ellipse cx="-24" cy="100" rx="9" ry="16" fill="#fff" opacity="0.28" filter="url(#soft)" transform="rotate(18 -24 100)"/>
    <!-- tailpiece -->
    <path d="M-7 96h14l-3 34h-8z" fill="url(#ebony)"/>
    <!-- bridge -->
    <path d="M-14 82h28l-3 5h-22z" fill="#f2d3a0"/>
    <!-- neck and fingerboard -->
    <path d="M-5 -76h10v80h-10z" fill="url(#neck)"/>
    <path d="M-6 -72h12l3 116h-18z" fill="url(#ebony)"/>
    <path d="M-4 -70l-2 112" stroke="#fff" stroke-width="1.4" opacity="0.35"/>
    <!-- strings -->
    <g stroke="#f4efe6" stroke-width="0.8" opacity="0.9">
      <path d="M-4.5 -76L-5 98M-1.5 -76L-1.7 98M1.5 -76L1.7 98M4.5 -76L5 98"/>
    </g>
    <!-- pegbox and scroll -->
    <path d="M-6 -96h12v22h-12z" fill="url(#neck)"/>
    <path d="M-6 -90h-6M-6 -82h-6M6 -90h6M6 -82h6" stroke="#2a0b03" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="0" cy="-104" r="10" fill="url(#neck)"/>
    <path d="M0 -104m-5 0a5 5 0 1 0 5-5a3 3 0 1 1-3 3" fill="none" stroke="#5e1d07" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-3" cy="-108" r="2.4" fill="#fff" opacity="0.7" filter="url(#soft)"/>
  </g>
</svg>
