<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5c"/>
      <stop offset="1" stop-color="#a3121a"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d42a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#6e0610" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff9a86"/>
      <stop offset="0.45" stop-color="#f4423a"/>
      <stop offset="1" stop-color="#c81d26"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="0.8" stop-color="#e2332f"/>
      <stop offset="1" stop-color="#ff8e7a"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g transform="translate(120 124) scale(0.9) translate(-120 -124)">
  <!-- skirt -->
  <rect x="24" y="40" width="192" height="184" rx="44" fill="url(#side)"/>
  <rect x="24" y="40" width="192" height="184" rx="44" fill="url(#sideR)"/>
  <!-- top face -->
  <rect x="44" y="24" width="152" height="156" rx="34" fill="url(#face)"/>
  <rect x="58" y="38" width="124" height="128" rx="26" fill="url(#dish)"/>
  <!-- return arrow -->
  <path d="M152 78v28c0 8-6 14-14 14H96" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 102l-18 18 18 18" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- highlights -->
  <path d="M62 34c30-6 80-6 116 0" fill="none" stroke="url(#spec)" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M40 70c-4 30-4 70 0 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="76" cy="52" rx="12" ry="6" fill="#fff" opacity="0.7" transform="rotate(-20 76 52)" filter="url(#soft)"/>
  </g>
</svg>
